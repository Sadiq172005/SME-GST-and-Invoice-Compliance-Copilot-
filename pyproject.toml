[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gst-compliance-copilot"
version = "1.0.0"
description = "OCR + RAG + multi-agent (LangGraph) GST invoice compliance copilot with FastAPI/Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  # LLM / RAG / agents
  "langchain>=0.3,<0.4",
  "langchain-openai>=0.2",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.2",
  "faiss-cpu>=1.8",
  # document parsing / OCR (system packages tesseract-ocr and poppler-utils are also required)
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "pdf2image>=1.17",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  # API
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.0", "requests>=2.31"]
dev = ["reportlab>=4.0", "pytest>=8.0", "ruff>=0.6", "nbformat>=5.9", "jupyter>=1.0", "httpx>=0.27"]
all = ["gst-compliance-copilot[ui,dev]"]

[tool.setuptools]
py-modules = ["pipeline", "app", "streamlit_app", "generate_samples", "evaluate", "build_notebook"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 130
